# Each team's external site follows the source repository's release branch.
# A team fork opts in with the TEAM_SITE_DEPLOY variable; repositories without
# it (including the source repository) never deploy anything.
name: 팀 사이트 release 배포

on:
  push:
    branches: [release]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: release가 그대로여도 다시 배포
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: team-site-release
  cancel-in-progress: false

jobs:
  sync:
    if: vars.TEAM_SITE_DEPLOY == 'enabled'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: 원본 release 동기화
        id: release
        env:
          # The default token cannot write workflow files; a fork that wants
          # releases changing them synced automatically adds SYNC_TOKEN.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          parent="$(gh api "repos/$repo" --jq '.parent.full_name // ""')"
          if [ -n "$parent" ]; then
            if gh api "repos/$repo/branches/release" --silent 2>/dev/null; then
              gh api -X POST "repos/$repo/merge-upstream" -f branch=release \
                --jq '"release 동기화: " + .merge_type'
            else
              upstream="$(gh api "repos/$parent/branches/release" --jq .commit.sha 2>/dev/null)" || {
                echo "::error::원본 저장소 $parent 에 release 브랜치가 없습니다."
                exit 1
              }
              gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/release \
                -f sha="$upstream" --silent
              echo "release 브랜치를 원본에서 만들었습니다."
            fi
            gh api -X POST "repos/$repo/merge-upstream" -f branch=main --silent 2>/dev/null ||
              echo "::warning::main은 동기화하지 못했습니다. 원본의 워크플로 파일이 바뀌었다면 GitHub의 Sync fork로 main을 맞추세요."
          fi
          head="$(gh api "repos/$repo/branches/release" --jq .commit.sha)"
          deployed="$(gh api "repos/$repo/git/ref/tags/team-site-deployed" --jq .object.sha 2>/dev/null)" || deployed=""
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$deployed" ] || [ "$FORCE" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "release $head 를 배포합니다."
          else
            echo "release $head 는 이미 배포했습니다."
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 배포 설정 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          GATEWAY_CONFIG: ${{ vars.GATEWAY_CONFIG }}
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF GATEWAY_CONFIG; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::fork의 Settings → Secrets and variables → Actions에 등록하세요: ${missing[*]}"
            exit 1
          fi
          printf '%s\n' "$GATEWAY_CONFIG" > .env.gateway.json
          node -e '
            const config = JSON.parse(require("fs").readFileSync(".env.gateway.json", "utf8"));
            if (!config.name || !config.vars?.APP_ORIGIN || !config.vars?.GRAEBOARD_EDGE_URL)
              throw new Error("GATEWAY_CONFIG에는 설정 안내 배포 단계의 gateway 설정 JSON 전체를 넣으세요.");
          '
      - run: npm ci --include=dev
      - name: 빌드
        run: |
          npm run build
          npm run build:edge
      - name: API 배포 (Supabase Edge Function)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy graeboard --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: 화면 배포 (Cloudflare gateway Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config .env.gateway.json
      - name: 배포 기록
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/team-site-deployed" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/team-site-deployed" \
              -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/team-site-deployed -f sha="$SHA" --silent
          fi
          echo "release $SHA 배포를 마쳤습니다."

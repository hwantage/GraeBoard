# Each team's external site follows the source repository's release branch.
# A team fork opts in with its TEAM_SITE_CONFIG variable (or the older
# TEAM_SITE_DEPLOY); repositories without either, including the source
# repository, never deploy anything.
name: 팀 사이트 release 배포

on:
  push:
    branches: [release]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: release가 그대로여도 다시 배포
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: team-site-release
  cancel-in-progress: false

jobs:
  sync:
    if: vars.TEAM_SITE_CONFIG != '' || vars.TEAM_SITE_DEPLOY == 'enabled'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: 원본 release 동기화
        id: release
        env:
          # The default token cannot write workflow files; a fork that wants
          # releases changing them synced automatically adds SYNC_TOKEN.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          parent="$(gh api "repos/$repo" --jq '.parent.full_name // ""')"
          if [ -n "$parent" ]; then
            if gh api "repos/$repo/branches/release" --silent 2>/dev/null; then
              gh api -X POST "repos/$repo/merge-upstream" -f branch=release \
                --jq '"release 동기화: " + .merge_type'
            else
              upstream="$(gh api "repos/$parent/branches/release" --jq .commit.sha 2>/dev/null)" || {
                echo "::error::원본 저장소 $parent 에 release 브랜치가 없습니다."
                exit 1
              }
              gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/release \
                -f sha="$upstream" --silent
              echo "release 브랜치를 원본에서 만들었습니다."
            fi
            gh api -X POST "repos/$repo/merge-upstream" -f branch=main --silent 2>/dev/null ||
              echo "::warning::main은 동기화하지 못했습니다. 원본의 워크플로 파일이 바뀌었다면 GitHub의 Sync fork로 main을 맞추세요."
          fi
          head="$(gh api "repos/$repo/branches/release" --jq .commit.sha)"
          deployed="$(gh api "repos/$repo/git/ref/tags/team-site-deployed" --jq .object.sha 2>/dev/null)" || deployed=""
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$deployed" ] || [ "$FORCE" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "release $head 를 배포합니다."
          else
            echo "release $head 는 이미 배포했습니다."
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 배포 설정 확인
        env:
          TEAM_SITE_CONFIG: ${{ vars.TEAM_SITE_CONFIG }}
          TEAM_SITE_SECRETS: ${{ secrets.TEAM_SITE_SECRETS }}
          # Forks set up before TEAM_SITE_CONFIG keep these separate values.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          GATEWAY_CONFIG: ${{ vars.GATEWAY_CONFIG }}
        run: node scripts/team-site-deploy.mjs --check
      - run: npm ci --include=dev
      - name: 빌드
        run: |
          npm run build
          npm run build:edge
      # API (Supabase Edge) → screen (gateway Worker) → both sides' secrets.
      - name: 배포와 설정 반영
        env:
          TEAM_SITE_CONFIG: ${{ vars.TEAM_SITE_CONFIG }}
          TEAM_SITE_SECRETS: ${{ secrets.TEAM_SITE_SECRETS }}
          # Forks set up before TEAM_SITE_CONFIG keep these separate values.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          GATEWAY_CONFIG: ${{ vars.GATEWAY_CONFIG }}
        run: node scripts/team-site-deploy.mjs
      - name: 배포 기록
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/team-site-deployed" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/team-site-deployed" \
              -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/team-site-deployed -f sha="$SHA" --silent
          fi
          echo "release $SHA 배포를 마쳤습니다."

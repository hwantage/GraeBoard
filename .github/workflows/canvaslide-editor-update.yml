name: CanvaSlide 편집기 갱신

# CanvaSlide main의 새 검증 커밋을 그래보드가 읽어 와 조립·검사하고, 통과한
# 조합의 배포본을 보관한 뒤 버전 갱신 PR을 만든다. CanvaSlide 쪽에는 아무것도
# 보내거나 쓰지 않는다. 원본 그래보드 저장소에서만 실행한다.
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvaslide-editor-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'hwantage/GraeBoard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 갱신할 커밋 확인
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan=$(node scripts/canvaslide/update-canvaslide-pin.mjs --apply)
          echo "$plan"
          echo "action=$(echo "$plan" | jq -r .action)" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo "$plan" | jq -r '.commit // empty')" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$plan" | jq -r '.branch // empty')" >> "$GITHUB_OUTPUT"
      - name: 원본의 pnpm 준비
        if: steps.plan.outputs.action == 'update'
        run: npm install --global "pnpm@$(jq -r .pnpm scripts/canvaslide/canvaslide-upstream.json)"
      - run: npm ci --include=dev
        if: steps.plan.outputs.action == 'update'
      # 조립은 원본 형 검사와 그래보드 연결 지점 검사를 포함한다. 실패하면
      # 여기서 끝나고 기존 고정 버전이 그대로 남는다.
      - name: 편집기 조립과 배포본 묶기
        if: steps.plan.outputs.action == 'update'
        run: |
          npm run build:canvaslide
          npm run build:canvaslide:pack
          npm run build
      - name: 호환성 검사
        if: steps.plan.outputs.action == 'update'
        run: |
          node --test --test-concurrency=1 tests/slides/*.test.mjs
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/slides --project=chromium
      # 임시 Actions 보관물이 아니라 저장소의 전용 브랜치에 남긴다. 추가만 하며
      # 기존 배포본은 지우지 않는다.
      - name: 배포본 보관
        if: steps.plan.outputs.action == 'update'
        run: |
          build=$(jq -r .bundle.buildId scripts/canvaslide/canvaslide-upstream.json)
          sha=$(jq -r .bundle.sha256 scripts/canvaslide/canvaslide-upstream.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin canvaslide-editor; then
            git worktree add ../bundles FETCH_HEAD
          else
            git worktree add --detach ../bundles
            git -C ../bundles checkout --orphan canvaslide-editor
            git -C ../bundles rm -rfq .
          fi
          mkdir -p ../bundles/bundles
          cp "dist-canvaslide/bundles/$build.tar.gz" ../bundles/bundles/
          git -C ../bundles add bundles
          git -C ../bundles commit -m "Keep editor bundle $build"
          git -C ../bundles push origin HEAD:refs/heads/canvaslide-editor
          # 받는 쪽이 쓸 주소에서 같은 바이트가 나오는지 확인한다.
          for attempt in 1 2 3 4 5 6; do
            got=$(curl -fsSL "$(jq -r .bundle.url scripts/canvaslide/canvaslide-upstream.json)" | sha256sum | cut -d' ' -f1 || true)
            [ "$got" = "$sha" ] && exit 0
            sleep 20
          done
          echo "보관한 배포본을 주소에서 확인하지 못했습니다." >&2
          exit 1
      - name: 버전 갱신 PR
        if: steps.plan.outputs.action == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          build=$(jq -r .bundle.buildId scripts/canvaslide/canvaslide-upstream.json)
          git checkout -b "$BRANCH"
          git add scripts/canvaslide/canvaslide-upstream.json
          git commit -m "Update the pinned CanvaSlide editor to ${COMMIT:0:12}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "CanvaSlide 편집기 갱신: ${COMMIT:0:7}" \
            --body "원본 CanvaSlide \`$COMMIT\`을 그래보드 어댑터와 조립해 빌드 \`$build\`를 만들었습니다. 조립(원본 형 검사·연결 지점 검사), \`tests/slides\`, 슬라이드 브라우저 검사(Chromium)를 통과했고 배포본을 \`canvaslide-editor\` 브랜치에 보관했습니다. 병합 전에 3개 브라우저 검사와 대표 자료의 신·구 버전 열기를 확인하세요."
